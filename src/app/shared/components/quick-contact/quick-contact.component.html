<div class="rounded-lg border border-teal/25 bg-navy p-5 text-white sm:p-6">
  <h2 class="font-heading text-lg font-bold sm:text-xl">Contact rapide</h2>
  <p class="mt-1 text-sm text-white/75">
    Le plus rapide pour un devis — appelez ou écrivez sur WhatsApp.
  </p>

  <div class="mt-5 space-y-3">
    <a
      [href]="'tel:' + site.mobile"
      class="flex w-full items-center justify-center gap-2 rounded bg-orange px-4 py-3.5 font-heading text-sm font-bold uppercase tracking-wide text-white transition hover:bg-orange/90"
    >
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path
          d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.3 1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.3 1.1L6.6 10.8Z"
        />
      </svg>
      Appeler {{ site.mobileDisplay }}
    </a>

    <a
      [href]="site.whatsappDevis"
      target="_blank"
      rel="noopener noreferrer"
      class="flex w-full items-center justify-center gap-2 rounded border-2 border-teal bg-teal/10 px-4 py-3.5 font-heading text-sm font-bold uppercase tracking-wide text-teal transition hover:bg-teal hover:text-navy"
    >
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path
          d="M12 2a10 10 0 0 0-8.7 14.9L2 22l5.3-1.4A10 10 0 1 0 12 2Zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3.1.8.8-3-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1-.2.2-.6.8-.7 1-.1.2-.3.2-.5.1-.2-.1-1-.4-1.9-1.2-.7-.6-1.2-1.4-1.3-1.6-.1-.2 0-.4.1-.5l.4-.5c.1-.1.2-.3.3-.4.1-.2 0-.3 0-.4 0-.1-.5-1.3-.7-1.7-.2-.5-.4-.4-.5-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 1.9s.8 2.2.9 2.3c.1.2 1.6 2.5 3.9 3.4 2.3.9 2.3.6 2.7.6.4 0 1.3-.5 1.5-1.1.2-.5.2-1 .1-1.1 0-.1-.2-.2-.4-.3Z"

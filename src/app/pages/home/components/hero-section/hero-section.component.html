<section class="relative isolate min-h-[70vh] overflow-hidden md:min-h-[78vh]">
  <img
    [src]="site.heroImage"
    alt="Rue traditionnelle à Djerba — intervention discrète Multi-Assainissement"
    class="absolute inset-0 h-full w-full object-cover"
    width="1600"
    height="900"
    fetchpriority="high"
  />
  <div class="absolute inset-0 bg-navy/75" aria-hidden="true"></div>

  <div
    class="relative mx-auto flex min-h-[70vh] max-w-7xl flex-col items-center justify-center px-4 py-20 text-center md:min-h-[78vh] lg:px-6"
  >
    <img
      [src]="site.logo"
      [alt]="site.name"
      class="mb-5 w-48 sm:mb-6 sm:w-56 md:w-64"
      width="256"
      height="118"
      fetchpriority="high"
    />
    <h1
      class="max-w-4xl font-heading text-3xl font-bold leading-tight text-white sm:text-4xl md:text-5xl"
    >
      Votre appartement sans cafards — intervention rapide à Djerba
    </h1>
    <p class="mt-5 max-w-2xl text-base text-white/90 sm:text-lg">
      Solutions radicales, professionnelles et discrètes pour particuliers,
      hôtels et restaurants.
    </p>

    <!-- Desktop CTAs -->
    <div class="mt-8 hidden w-full max-w-xl gap-3 sm:flex sm:justify-center">
      <a
        [href]="site.whatsappDevis"
        target="_blank"
        rel="noopener noreferrer"
        class="rounded bg-orange px-6 py-3.5 font-heading text-sm font-bold uppercase tracking-wide text-white transition hover:bg-orange/90"
      >
        WhatsApp Devis
      </a>
      <a
        [href]="'tel:' + site.mobile"
        class="inline-flex items-center justify-center rounded border-2 border-white px-6 py-3.5 font-heading text-sm font-bold uppercase tracking-wide text-white transition hover:bg-white/10"
      >
        Appeler Maintenant
      </a>
    </div>

    <!-- Mobile CTAs -->
    <div class="mt-8 flex w-full max-w-md flex-col gap-3 sm:hidden">
      <a
        [href]="site.whatsappDevis"
        target="_blank"
        rel="noopener noreferrer"
        class="w-full rounded bg-orange px-6 py-3.5 font-heading text-sm font-bold uppercase tracking-wide text-white transition hover:bg-orange/90"
      >
        WhatsApp Devis
      </a>
      <a
        [href]="'tel:' + site.mobile"
        class="w-full rounded border-2 border-white px-6 py-3.5 font-heading text-sm font-bold uppercase tracking-wide text-white transition hover:bg-white/10"
      >
        Appeler {{ site.mobileDisplay }}
      </a>
    </div>
  </div>
</section>

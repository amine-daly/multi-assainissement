<section
  id="nos-clients"
  class="scroll-mt-24 border-y border-concrete bg-concrete/60 py-12 lg:py-14"
  aria-labelledby="clients-heading"
>
  <div class="mx-auto max-w-7xl px-4 lg:px-6">
    <div class="flex flex-col items-center gap-3 text-center sm:flex-row sm:items-end sm:justify-between sm:text-start">
      <div>
        <p class="font-heading text-xs font-semibold uppercase tracking-[0.2em] text-teal">
          {{ 'home.clients.eyebrow' | translate }}
        </p>
        <h2
          id="clients-heading"
          class="mt-1 font-heading text-xl font-bold text-navy sm:text-2xl"
        >
          {{ 'home.clients.title' | translate }}
        </h2>
      </div>
      <p class="max-w-md text-sm text-dark-text/75">
        {{ 'home.clients.count' | translate: { count } }}
        <a routerLink="/a-propos" class="font-semibold text-teal underline">
          {{ 'home.clients.seeFullList' | translate }}
        </a>
      </p>
    </div>

    <ul
      class="mt-8 grid grid-cols-2 items-stretch gap-3 sm:grid-cols-3 lg:grid-cols-6 lg:gap-4"
    >
      @for (logo of logos; track logo.src) {
        <li>
          <figure
            class="client-logo flex h-28 items-center justify-center bg-white px-4 py-3 sm:h-32"
          >
            <img
              [src]="logo.src"
              alt=""
              class="client-logo__img max-h-20 w-auto max-w-full object-contain sm:max-h-24"
              width="160"
              height="96"
              loading="lazy"
              decoding="async"
            />
            <figcaption class="sr-only">{{ logo.name }}</figcaption>
          </figure>
        </li>
      }
    </ul>
  </div>
</section>

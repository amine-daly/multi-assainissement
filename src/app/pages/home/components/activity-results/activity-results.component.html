<section
  id="nos-interventions"
  class="bg-white py-16 lg:py-20"
  aria-labelledby="results-heading"
>
  <div class="mx-auto max-w-7xl px-4 lg:px-6">
    <div class="mx-auto max-w-2xl text-center">
      <p class="font-heading text-sm font-semibold uppercase tracking-[0.2em] text-teal">
        Preuves de terrain
      </p>
      <h2
        id="results-heading"
        class="mt-3 font-heading text-2xl font-bold text-navy sm:text-3xl"
      >
        Avant / après : des résultats visibles
      </h2>
      <p class="mt-3 text-base text-dark-text/80">
        Zones traitées à Djerba — sans photos macro de nuisibles. Discrétion
        pour particuliers, hôtels et restaurants.
      </p>
    </div>

    <!-- Before / after — conversion focus -->
    <div class="mt-12 grid gap-8 lg:grid-cols-2">
      @for (pair of pairs; track pair.beforeSrc) {
        <figure>
          <p class="mb-3 font-heading text-sm font-semibold text-navy">
            {{ pair.label }}
          </p>
          <div class="grid grid-cols-2 gap-2">
            <div class="relative">
              <img
                [src]="pair.beforeSrc"
                [alt]="pair.beforeAlt"
                class="aspect-[4/3] w-full object-cover"
                width="600"
                height="450"
                loading="lazy"
              />
              <span
                class="absolute bottom-0 left-0 bg-navy px-3 py-1 font-heading text-[11px] font-bold uppercase tracking-wide text-white"
              >
                Avant
              </span>
            </div>
            <div class="relative">
              <img
                [src]="pair.afterSrc"
                [alt]="pair.afterAlt"
                class="aspect-[4/3] w-full object-cover"
                width="600"
                height="450"
                loading="lazy"
              />
              <span
                class="absolute bottom-0 left-0 bg-teal px-3 py-1 font-heading text-[11px] font-bold uppercase tracking-wide text-white"
              >
                Après
              </span>
            </div>
          </div>
        </figure>
      }
    </div>

    <!-- Supporting activity shots -->
    <div class="mt-10 grid gap-3 sm:grid-cols-3">
      @for (shot of shots; track shot.src) {
        <figure class="relative overflow-hidden">
          <img
            [src]="shot.src"
            [alt]="shot.alt"
            class="aspect-[4/3] w-full object-cover"
            width="480"
            height="360"
            loading="lazy"
          />
          <figcaption
            class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-navy/90 to-transparent px-3 pb-3 pt-10 font-heading text-xs font-semibold text-white sm:text-sm"
          >
            {{ shot.label }}
          </figcaption>
        </figure>
      }
    </div>

    <div class="mt-10 text-center">
      <button
        type="button"
        class="rounded bg-orange px-6 py-3.5 font-heading text-sm font-bold uppercase tracking-wide text-white transition hover:bg-orange/90"
        (click)="onDevisClick($event)"
      >
        Demander un Devis
      </button>
    </div>
  </div>
</section>

<section
  class="mx-auto flex min-h-[55vh] max-w-3xl flex-col items-center justify-center px-4 py-16 text-center lg:px-6"
>
  <p class="font-heading text-sm font-semibold uppercase tracking-widest text-teal">
    {{ 'notFound.code' | translate }}
  </p>
  <h1 class="mt-3 font-heading text-3xl font-bold text-navy sm:text-4xl">
    {{ 'notFound.title' | translate }}
  </h1>
  <p class="mt-4 max-w-xl text-base leading-relaxed text-dark-text">
    {{ 'notFound.body' | translate: { name: site.name } }}
  </p>

  <div class="mt-8 flex w-full max-w-md flex-col gap-3 sm:flex-row sm:justify-center">
    <a
      routerLink="/"
      class="rounded bg-orange px-6 py-3.5 font-heading text-sm font-bold uppercase tracking-wide text-white transition hover:bg-orange/90"
    >
      {{ 'notFound.home' | translate }}
    </a>
    <a
      [href]="lang.whatsappDevisUrl()"
      target="_blank"
      rel="noopener noreferrer"
      class="rounded border-2 border-navy px-6 py-3.5 font-heading text-sm font-bold uppercase tracking-wide text-navy transition hover:bg-navy/5"
    >
      {{ 'common.whatsappDevis' | translate }}
    </a>
  </div>

  <a
    routerLink="/contact"
    class="mt-4 font-heading text-sm font-semibold text-teal underline decoration-teal/40 underline-offset-4 hover:decoration-teal"
  >
    {{ 'notFound.contact' | translate }}
  </a>
</section>

version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - node -v
        - npm -v
        - npm ci
    build:
      commands:
        # npm run build also copies prerendered 404 → 404.html for Amplify
        - npm run build
  artifacts:
    baseDirectory: dist/multi-assainissement/browser
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*

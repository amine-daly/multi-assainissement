<div
  class="fixed inset-x-0 bottom-0 z-50 border-t border-navy/10 bg-white shadow-[0_-4px_20px_rgba(10,37,64,0.12)] md:hidden"
  role="navigation"
  aria-label="Actions rapides"
>
  <div class="grid h-16 grid-cols-3">
    <a
      [href]="'tel:' + site.mobile"
      class="flex flex-col items-center justify-center gap-0.5 text-navy transition hover:bg-concrete"
    >
      <svg class="h-5 w-5 text-teal" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path
          d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.3 1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.3 1.1L6.6 10.8Z"
        />
      </svg>
      <span class="text-[10px] font-bold uppercase tracking-wide">Appeler</span>
    </a>

    <a
      [href]="site.whatsapp"
      target="_blank"
      rel="noopener noreferrer"
      class="flex flex-col items-center justify-center gap-0.5 border-x border-concrete text-navy transition hover:bg-concrete"
    >
      <svg class="h-5 w-5 text-teal" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path
          d="M12 2a10 10 0 0 0-8.7 14.9L2 22l5.3-1.4A10 10 0 1 0 12 2Zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3.1.8.8-3-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1-.2.2-.6.8-.7 1-.1.2-.3.2-.5.1-.2-.1-1-.4-1.9-1.2-.7-.6-1.2-1.4-1.3-1.6-.1-.2 0-.4.1-.5l.4-.5c.1-.1.2-.3.3-.4.1-.2 0-.3 0-.4 0-.1-.5-1.3-.7-1.7-.2-.5-.4-.4-.5-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 1.9s.8 2.2.9 2.3c.1.2 1.6 2.5 3.9 3.4 2.3.9 2.3.6 2.7.6.4 0 1.3-.5 1.5-1.1.2-.5.2-1 .1-1.1 0-.1-.2-.2-.4-.3Z"
        />
      </svg>
      <span class="text-[10px] font-bold uppercase tracking-wide">WhatsApp</span>
    </a>

    <button
      type="button"
      class="flex flex-col items-center justify-center gap-0.5 bg-orange text-white transition hover:bg-orange/90"
      (click)="onDevisClick($event)"
    >
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" d="M8 7h8M8 12h8M8 17h5" />
        <rect x="4" y="3" width="16" height="18" rx="2" />
      </svg>
      <span class="text-[10px] font-bold uppercase tracking-wide">Devis</span>
    </button>
  </div>
</div>

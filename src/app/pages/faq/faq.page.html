<app-page-header title="Questions fréquentes" subtitle="Réponses rapides avant votre intervention" />

<section class="mx-auto max-w-3xl px-4 py-10 lg:px-6 lg:py-14">
  <div class="space-y-4">
    @for (item of faqs; track item.q) {
      <details class="rounded-lg border border-concrete bg-white p-4 open:shadow-sm">
        <summary class="cursor-pointer font-heading font-semibold text-navy">
          {{ item.q }}
        </summary>
        <p class="mt-3 text-sm leading-relaxed text-dark-text">{{ item.a }}</p>
      </details>
    }
  </div>
</section>

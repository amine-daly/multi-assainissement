<section class="bg-white py-16 lg:py-20">
  <div class="mx-auto max-w-7xl px-4 lg:px-6">
    <h2 class="text-center font-heading text-2xl font-bold text-navy sm:text-3xl">
      Nos Services d'Assainissement
    </h2>

    <div class="mt-10 grid gap-6 md:grid-cols-3">
      @for (service of services; track service.path) {
        <article
          class="group rounded border border-concrete bg-white p-6 transition hover:border-t-[3px] hover:border-t-teal hover:shadow-lg"
        >
          <div
            class="mb-4 inline-flex h-12 w-12 items-center justify-center rounded-lg bg-teal/10 text-teal"
          >
            @switch (service.icon) {
              @case ('insect') {
                <svg class="h-7 w-7" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M12 4a3 3 0 0 1 3 3v1h2.5a.5.5 0 0 1 0 1H15v2h3a.5.5 0 0 1 0 1h-3v2h2.5a.5.5 0 0 1 0 1H15v1a3 3 0 0 1-6 0v-1H6.5a.5.5 0 0 1 0-1H9v-2H6a.5.5 0 0 1 0-1h3V9H6.5a.5.5 0 0 1 0-1H9V7a3 3 0 0 1 3-3Zm-1 9h2v2a1 1 0 1 1-2 0v-2Zm0-5h2v3h-2V8Z" />
                </svg>
              }
              @case ('rodent') {
                <svg class="h-7 w-7" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M18 9a3 3 0 0 1 3 3c0 2.5-2 4-5 5v2h-2v-1.1c-.7.1-1.3.1-2 .1-4 0-7-2.2-7-5.5 0-1.5.8-2.8 2.1-3.7A5 5 0 0 1 12 5c2.2 0 4.1 1.2 4.8 3H18Zm-6-2a3 3 0 0 0-2.8 2H16a3 3 0 0 0-4-2Z" />
                </svg>
              }
              @case ('building') {
                <svg class="h-7 w-7" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M4 21V3h10v6h6v12H4Zm2-2h2v-2H6v2Zm0-4h2v-2H6v2Zm0-4h2V9H6v2Zm0-4h2V5H6v2Zm4 12h2v-2h-2v2Zm0-4h2v-2h-2v2Zm0-4h2V9h-2v2Zm0-4h2V5h-2v2Zm4 12h4v-2h-2v-2h2v-2h-2v-2h2V11h-4v10Z" />
                </svg>
              }
            }
          </div>

          <h3 class="font-heading text-xl font-bold text-navy">{{ service.title }}</h3>
          <p class="mt-3 text-sm leading-relaxed text-dark-text">
            {{ service.description }}
          </p>
          <a
            [routerLink]="service.path"
            class="mt-5 inline-flex items-center gap-1 font-heading text-sm font-semibold text-teal underline decoration-teal/40 underline-offset-4 transition group-hover:decoration-teal"
          >
            En savoir plus
            <span aria-hidden="true">›</span>
          </a>
        </article>
      }
    </div>
  </div>
</section>

<section class="bg-navy py-12 text-white lg:py-14">
  <div class="mx-auto max-w-7xl px-4 text-center lg:px-6">
    <p class="font-heading text-xl font-bold sm:text-2xl">
      {{ 'home.urgency.title' | translate }}
    </p>

    <div
      class="mt-6 flex flex-col items-center justify-center gap-4 sm:flex-row sm:gap-10"
    >
      <a
        [href]="'tel:' + site.tel"
        class="inline-flex items-center gap-2 text-lg font-semibold text-white transition hover:text-teal"
        dir="ltr"
      >
        <svg class="h-5 w-5 text-teal" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.3 1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.3 1.1L6.6 10.8Z"
          />
        </svg>
        {{ site.telDisplay }}
      </a>
      <a
        [href]="'tel:' + site.mobile"
        class="inline-flex items-center gap-2 text-lg font-semibold text-white transition hover:text-teal"
        dir="ltr"
      >
        <svg class="h-5 w-5 text-teal" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            d="M11 2a1 1 0 0 1 1 1v1.07A7.002 7.002 0 0 1 18.93 11H20a1 1 0 1 1 0 2h-1.07A7.002 7.002 0 0 1 12 19.93V21a1 1 0 1 1-2 0v-1.07A7.002 7.002 0 0 1 3.07 13H2a1 1 0 1 1 0-2h1.07A7.002 7.002 0 0 1 10 4.07V3a1 1 0 0 1 1-1Zm0 5a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"
          />
        </svg>
        {{ site.mobileDisplay }}
      </a>
    </div>

    <a
      [href]="lang.whatsappDevisUrl()"
      target="_blank"
      rel="noopener noreferrer"
      class="mt-5 inline-flex items-center gap-2 font-heading text-sm font-semibold text-teal transition hover:text-teal/80"
      dir="ltr"
    >
      {{ 'home.urgency.whatsappLabel' | translate }}
    </a>
  </div>
</section>

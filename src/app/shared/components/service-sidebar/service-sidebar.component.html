<aside class="space-y-4 lg:sticky lg:top-20 lg:self-start">
  <app-quick-contact />
  <app-lead-form />

  <nav
    class="rounded border border-concrete bg-white p-4"
    [attr.aria-label]="'sidebar.usefulLinksAria' | translate"
  >
    <h2 class="font-heading text-sm font-bold uppercase tracking-wide text-navy">
      {{ 'sidebar.seeAlso' | translate }}
    </h2>
    <ul class="mt-3 space-y-2 text-sm">
      @for (link of relatedLinks; track link.path) {
        <li>
          <a
            [routerLink]="link.path | localePath"
            class="font-medium text-teal underline decoration-teal/30 underline-offset-2 hover:decoration-teal"
          >
            {{ link.labelKey | translate }}
          </a>
        </li>
      }
    </ul>
    @if (alternate; as alt) {
      <p class="mt-4 border-t border-concrete pt-3 text-sm">
        <a
          [href]="alt.href"
          [attr.hreflang]="alt.hreflang"
          [attr.lang]="alt.hreflang"
          class="font-semibold text-teal underline decoration-teal/30 underline-offset-2 hover:decoration-teal"
          (click)="switchTo($event, alt.lang)"
        >
          {{ alt.label }}
        </a>
      </p>
    }
  </nav>
</aside>

<app-page-header
  titleKey="privacy.header.title"
  subtitleKey="privacy.header.subtitle"
/>

<section class="mx-auto max-w-3xl px-4 py-10 text-dark-text lg:px-6 lg:py-14">
  <p class="leading-relaxed">
    {{ 'privacy.p1' | translate: { name: site.name } }}
  </p>
  <p class="mt-4 leading-relaxed">
    {{ 'privacy.p2' | translate }}
  </p>
  <p class="mt-4 leading-relaxed">
    {{ 'privacy.p3.prefix' | translate }}
    <a
      class="font-semibold text-teal underline"
      dir="ltr"
      [href]="'mailto:' + site.email"
    >
      {{ site.email }}
    </a>
    {{ 'privacy.p3.mid' | translate }}
    <a
      class="font-semibold text-teal underline"
      dir="ltr"
      [href]="'tel:' + site.mobile"
    >
      {{ site.mobileDisplay }}</a
    >.
  </p>
</section>

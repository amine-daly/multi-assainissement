<app-page-header
  title="Contactez Multi-Assainissement"
  subtitle="Demandez votre devis — intervention sur toute l'Île de Djerba"
/>

<section class="mx-auto max-w-7xl px-4 py-10 lg:px-6 lg:py-14">
  <div class="grid gap-10 lg:grid-cols-[minmax(0,1fr)_minmax(0,1.2fr)] lg:gap-12">
    <div>
      <h2 class="font-heading text-xl font-bold text-navy">Coordonnées</h2>
      <ul class="mt-4 space-y-3 text-dark-text">
        <li>
          <span class="block text-sm font-semibold text-teal">Adresse</span>
          {{ site.address }}
        </li>
        <li>
          <span class="block text-sm font-semibold text-teal">Téléphone</span>
          <a class="hover:text-teal" [href]="'tel:' + site.tel">{{ site.telDisplay }}</a>
        </li>
        <li>
          <span class="block text-sm font-semibold text-teal">Mobile</span>
          <a class="hover:text-teal" [href]="'tel:' + site.mobile">{{ site.mobileDisplay }}</a>
        </li>
        <li>
          <span class="block text-sm font-semibold text-teal">Fax</span>
          {{ site.faxDisplay }}
        </li>
        <li>
          <span class="block text-sm font-semibold text-teal">Email</span>
          <a class="hover:text-teal" [href]="'mailto:' + site.email">{{ site.email }}</a>
        </li>
        <li>
          <span class="block text-sm font-semibold text-teal">WhatsApp</span>
          <a
            class="hover:text-teal"
            [href]="site.whatsapp"
            target="_blank"
            rel="noopener noreferrer"
          >
            wa.me/21698962556
          </a>
        </li>
      </ul>

      <div class="mt-8">
        <app-emergency-card />
      </div>
    </div>

    <div class="lg:sticky lg:top-20 lg:self-start">
      <app-lead-form />
    </div>
  </div>
</section>

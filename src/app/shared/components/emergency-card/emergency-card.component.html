<aside class="rounded-lg border border-orange/30 bg-orange/5 p-5">
  <p class="font-heading text-sm font-bold uppercase tracking-wide text-navy">
    Besoin d'intervenir ?
  </p>
  <p class="mt-2 text-sm text-dark-text">
    Appelez ou WhatsApp — réponse rapide.
  </p>
  <a
    [href]="'tel:' + site.mobile"
    class="mt-4 flex items-center gap-2 font-heading text-lg font-bold text-navy hover:text-teal"
  >
    <svg class="h-5 w-5 text-teal" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path
        d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.3 1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.3 1.1L6.6 10.8Z"
      />
    </svg>
    {{ site.mobileDisplay }}
  </a>
  <a
    [href]="site.whatsappDevis"
    target="_blank"
    rel="noopener noreferrer"
    class="mt-3 inline-flex w-full items-center justify-center gap-2 rounded bg-teal px-4 py-2.5 text-sm font-bold text-navy transition hover:bg-teal/90"
  >
    WhatsApp devis
  </a>
</aside>

<aside class="space-y-4 lg:sticky lg:top-20 lg:self-start">
  <app-lead-form />
  <app-emergency-card />

  <nav
    class="rounded border border-concrete bg-white p-4"
    aria-label="Liens utiles"
  >
    <h2 class="font-heading text-sm font-bold uppercase tracking-wide text-navy">
      Voir aussi
    </h2>
    <ul class="mt-3 space-y-2 text-sm">
      @for (link of relatedLinks; track link.path) {
        <li>
          <a
            [routerLink]="link.path"
            class="font-medium text-teal underline decoration-teal/30 underline-offset-2 hover:decoration-teal"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>
  </nav>
</aside>

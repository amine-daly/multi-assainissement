<a
  routerLink="/"
  class="inline-flex items-center no-underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal"
  [attr.aria-label]="'brand.homeAria' | translate: { name }"
>
  <img
    [src]="logo"
    [alt]="name"
    class="h-11 w-auto sm:h-12"
    width="220"
    height="132"
    decoding="async"
  />
</a>

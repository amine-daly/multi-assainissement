<header class="sticky top-0 z-50 bg-navy text-white shadow-md">
  <div
    class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-3 lg:px-6"
  >
    <app-brand-logo class="shrink-0" />

    <!-- Desktop nav -->
    <nav class="hidden items-center gap-6 lg:flex" aria-label="Navigation principale">
      @for (link of site.navLinks; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="text-teal underline decoration-teal decoration-2 underline-offset-8"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          class="font-heading text-sm font-medium text-white/90 transition hover:text-teal"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <!-- Desktop CTA -->
    <div class="hidden items-center gap-4 lg:flex">
      <a
        [href]="'tel:' + site.mobile"
        class="inline-flex items-center gap-2 text-sm text-white/90 transition hover:text-teal"
      >
        <svg class="h-5 w-5 text-teal" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.3 1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.3 1.1L6.6 10.8Z"
          />
        </svg>
        <span>
          <span class="block text-xs text-white/60">Urgence 24/7</span>
          <span class="font-semibold">{{ site.mobileDisplay }}</span>
        </span>
      </a>
      <button
        type="button"
        class="rounded bg-orange px-4 py-2.5 font-heading text-sm font-bold uppercase tracking-wide text-white transition hover:bg-orange/90 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-orange"
        (click)="onDevisClick($event)"
      >
        Devis Gratuit
      </button>
    </div>

    <!-- Mobile menu toggle -->
    <button
      type="button"
      class="inline-flex items-center justify-center rounded p-2 text-white lg:hidden"
      [attr.aria-expanded]="menuOpen"
      aria-controls="mobile-nav"
      aria-label="Ouvrir le menu"
      (click)="toggleMenu()"
    >
      @if (!menuOpen) {
        <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-width="2" d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      } @else {
        <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-width="2" d="M6 6l12 12M18 6L6 18" />
        </svg>
      }
    </button>
  </div>

  <!-- Mobile drawer -->
  @if (menuOpen) {
    <div id="mobile-nav" class="border-t border-white/10 lg:hidden">
      <nav class="flex flex-col gap-1 px-4 py-3" aria-label="Navigation mobile">
        @for (link of site.navLinks; track link.path) {
          <a
            [routerLink]="link.path"
            routerLinkActive="bg-white/10 text-teal"
            [routerLinkActiveOptions]="{ exact: link.path === '/' }"
            class="rounded px-3 py-3 font-heading text-base font-medium text-white"
            (click)="closeMenu()"
          >
            {{ link.label }}
          </a>
        }
        <a
          [href]="'tel:' + site.mobile"
          class="mt-2 rounded px-3 py-3 text-sm text-teal"
          (click)="closeMenu()"
        >
          Appeler {{ site.mobileDisplay }}
        </a>
        <button
          type="button"
          class="mt-1 rounded bg-orange px-3 py-3 font-heading text-sm font-bold uppercase text-white"
          (click)="onDevisClick($event)"
        >
          Devis Gratuit
        </button>
      </nav>
    </div>
  }
</header>

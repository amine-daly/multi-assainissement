<a
  routerLink="/"
  class="inline-flex items-center gap-2 text-white no-underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal"
  [attr.aria-label]="name + ' — Accueil'"
>
  <svg
    class="h-9 w-9 shrink-0"
    viewBox="0 0 40 40"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
    aria-hidden="true"
  >
    <circle cx="20" cy="20" r="19" stroke="#14b8a6" stroke-width="2" />
    <!-- water drop -->
    <path
      d="M20 8c-4.5 6.2-7 10-7 13.2a7 7 0 0 0 14 0C27 18 24.5 14.2 20 8Z"
      fill="#14b8a6"
    />
    <!-- palm frond -->
    <path
      d="M20 22c0-4 2.5-8 6.5-11-1 5-.5 8.5 2 11.5-3 .5-5.5-1-8.5-.5Z"
      fill="#0d9488"
      opacity="0.9"
    />
    <path
      d="M20 22c0-4-2.5-8-6.5-11 1 5 .5 8.5-2 11.5 3 .5 5.5-1 8.5-.5Z"
      fill="#0f766e"
      opacity="0.85"
    />
  </svg>
  @if (!compact) {
    <span class="font-heading text-sm font-bold tracking-tight sm:text-base">
      {{ name }}
    </span>
  } @else {
    <span class="font-heading text-sm font-bold tracking-tight">M-A</span>
  }
</a>
